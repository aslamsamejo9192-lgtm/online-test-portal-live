name: Upload test to portalTests

# Manual-only test-upload path for the Online Test Portal (never runs
# automatically). A maintainer commits a test JSON file to this repo, then runs
# this workflow by hand. It signs in with a dedicated Firebase Auth uploader
# account (email + password stored as GitHub Secrets; values are never printed
# or committed) and writes ONE document into the portalTests collection.
# The uploader account can ONLY write portalTests (scoped Firestore rule);
# it cannot read student results or touch any other collection.
# FIREBASE_API_KEY below is the public Firebase web API key — the same value
# already shipped in the site's page source. It is an identifier, not a
# secret; access control comes from Firestore rules.
#
# Test JSON format:
# {
#   "title": "Biology — Cell Structure & Function",
#   "chapter": "Chapter 2 · Cell Biology",
#   "subject": "Biology",
#   "minutes": 10,
#   "from": "30 Oct 2026, 9:00 AM",
#   "to": "30 Oct 2026, 11:59 PM",
#   "questions": [
#     { "q": "Question text?", "options": ["A", "B", "C", "D"], "answer": 1, "points": 1 }
#   ]
# }
# `answer` is the 0-based index of the correct option.

on:
  workflow_dispatch:
    inputs:
      test_json_path:
        description: "Path in this repo to the test JSON file"
        required: true
        default: "tests/test.json"
      test_doc_id:
        description: "Firestore document ID (optional; defaults to the file name without extension)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign in and write test document
        env:
          PORTAL_UPLOADER_EMAIL: ${{ secrets.PORTAL_UPLOADER_EMAIL }}
          PORTAL_UPLOADER_PASSWORD: ${{ secrets.PORTAL_UPLOADER_PASSWORD }}
          FIREBASE_API_KEY: AIzaSyDcl40Rd9qltVxIrU-XTitXSckmAKLnO0M
          FIREBASE_PROJECT_ID: graphic-mode-k5p7n
          FIREBASE_DATABASE_ID: ai-studio-examflow-90c5e0d3-b852-4230-9b5f-275b0a37264b
          TEST_JSON_PATH: ${{ inputs.test_json_path }}
          TEST_DOC_ID: ${{ inputs.test_doc_id }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          from pathlib import Path

          def fail(msg):
              print("ERROR:", msg)
              sys.exit(1)

          email = os.environ["PORTAL_UPLOADER_EMAIL"]
          password = os.environ["PORTAL_UPLOADER_PASSWORD"]
          api_key = os.environ["FIREBASE_API_KEY"]
          project = os.environ["FIREBASE_PROJECT_ID"]
          database = os.environ["FIREBASE_DATABASE_ID"]
          path = Path(os.environ["TEST_JSON_PATH"])
          doc_id = os.environ.get("TEST_DOC_ID") or path.stem

          data = json.loads(path.read_text(encoding="utf-8"))
          assert isinstance(data, dict), "test JSON must be an object"
          assert data.get("title"), "test JSON needs a title"
          assert isinstance(data.get("questions"), list) and data["questions"], \
              "test JSON needs a non-empty questions array"
          for q in data["questions"]:
              assert q.get("options") and isinstance(q["options"], list), \
                  "each question needs an options array"
              assert isinstance(q.get("answer"), int), \
                  "each question needs an integer answer index"

          # 1. Sign in with the uploader account (ID token is never printed).
          auth_url = ("https://identitytoolkit.googleapis.com/v1/accounts:"
                      "signInWithPassword?key=" + api_key)
          req = urllib.request.Request(
              auth_url,
              data=json.dumps({"email": email, "password": password,
                               "returnSecureToken": True}).encode(),
              headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req) as resp:
                  id_token = json.loads(resp.read())["idToken"]
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              try:
                  code = json.loads(body)["error"]["message"]
              except Exception:
                  code = "sign-in failed"
              fail("uploader sign-in failed: " + code)

          # 2. Convert the test JSON to Firestore REST field format.
          def convert(v):
              if isinstance(v, str):
                  return {"stringValue": v}
              if isinstance(v, bool):
                  return {"booleanValue": v}
              if isinstance(v, int):
                  return {"integerValue": str(v)}
              if isinstance(v, float):
                  return {"doubleValue": v}
              if isinstance(v, list):
                  return {"arrayValue": {"values": [convert(x) for x in v]}}
              if isinstance(v, dict):
                  return {"mapValue": {"fields": {k: convert(x) for k, x in v.items()}}}
              if v is None:
                  return {"nullValue": None}
              fail("unsupported value type: " + type(v).__name__)

          fields = {k: convert(v) for k, v in data.items()}
          base = ("https://firestore.googleapis.com/v1/projects/" + project +
                  "/databases/" + database + "/documents/portalTests/" + doc_id)
          mask = "&".join("updateMask.fieldPaths=" + k for k in data)
          headers = {"Authorization": "Bearer " + id_token,
                     "Content-Type": "application/json"}

          def call(method, url, body):
              r = urllib.request.Request(url, data=json.dumps(body).encode(),
                                         headers=headers, method=method)
              try:
                  with urllib.request.urlopen(r) as resp:
                      return resp.status
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors="replace")

          status = call("PATCH", base + "?" + mask, {"fields": fields})
          if isinstance(status, tuple) and status[0] == 404:
              coll = base.rsplit("/portalTests/", 1)[0] + "/portalTests"
              status = call("POST", coll + "?documentId=" + doc_id,
                            {"fields": fields})
          if isinstance(status, tuple):
              fail("Firestore write failed (HTTP %s): %s" % (status[0], status[1][:300]))
          print("wrote portalTests/%s (%d questions)" % (doc_id, len(data["questions"])))
          PYEOF
